<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
  </head>
  <body>
    <h1>Contacto</h1>
    <p>
      Para cualquier consulta o información adicional, puedes contactarnos a
      través de:
    </p>
    <ul>
      <li><strong>Teléfono:</strong> +34 987 654 321</li>
      <li><strong>Email:</strong> info@desguacesplaza.com</li>
      <li><strong>Dirección:</strong> Calle Principal, 123, 45678 Ciudad</li>
    </ul>

    <p>
        O también puedes rellenar el siguiente formulario de contacto:
        <form action="" method="get">
            <label for="name">Nombre:</label><br />
            <input type="text" id="name" name="name" required /><br /><br />
    
            <label for="email">Correo electrónico:</label><br />
            <input type="email" id="email" name="email" required /><br /><br />
    
            <label for="message">Mensaje:</label><br />
            <textarea id="message" name="message" required></textarea
            ><br /><br />
    
            <input type="submit" value="Enviar" />
    </p>

    <a href="index.html">Volver al inicio</a>
  </body>
</html>
